<div style="max-width: 600px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;">
  <h2 style="text-align: center; color: #333;">Registro de Pólizas</h2>
  
  <form (ngSubmit)="guardarPoliza()">
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Pertenece a la Aseguradora:</label>
      <select [(ngModel)]="poliza.aseguradora.id" name="aseguradoraId" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        <option [ngValue]="null">Seleccione Aseguradora</option>
        <option *ngFor="let a of aseguradoras" [ngValue]="a.id">{{ a.nombre }}</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Número de Póliza:</label>
      <input type="text" [(ngModel)]="poliza.numeroPoliza" name="numero" required placeholder="Ej: POL-999" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Monto de Cobertura ($):</label>
      <input type="number" [(ngModel)]="poliza.montoCobertura" name="cobertura" required placeholder="Ej: 15000" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <!-- input para la Fecha de Expiración -->
    <div style="margin-bottom: 20px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Fecha de Expiración:</label>
      <input type="date" [(ngModel)]="poliza.fechaExpiracion" name="fechaExpiracion" required style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <button type="submit" style="width: 100%; background-color: #ff9800; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
      Registrar Póliza
    </button>
  </form>
</div>
