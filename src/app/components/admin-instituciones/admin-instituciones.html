<div style="max-width: 600px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;">
  <h2 style="text-align: center; color: #333;">Registro de Institución (Cliente)</h2>
  
  <form (ngSubmit)="guardarInstitucion()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">RUC:</label>
      <input type="text" [(ngModel)]="institucion.ruc" name="ruc" required placeholder="Ej: 1760000000001" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Razón Social:</label>
      <input type="text" [(ngModel)]="institucion.razonSocial" name="razonSocial" required placeholder="Ej: Ministerio de Salud" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <button type="submit" style="width: 100%; background-color: #673ab7; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">
      Registrar Institución
    </button>
  </form>
</div>
