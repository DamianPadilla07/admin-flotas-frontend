<div style="max-width: 600px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;">
  <h2 style="text-align: center; color: #333;">Registro de Aseguradoras</h2>
  
  <form (ngSubmit)="guardarAseguradora()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Nombre de la Aseguradora:</label>
      <input type="text" [(ngModel)]="aseguradora.nombre" name="nombre" required placeholder="Ej: Mapfre" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Teléfono de Contacto:</label>
      <input type="text" [(ngModel)]="aseguradora.telefonoContacto" name="telefono" required placeholder="Ej: 0999999999" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <button type="submit" style="width: 100%; background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
      Registrar Aseguradora
    </button>
  </form>
</div>
