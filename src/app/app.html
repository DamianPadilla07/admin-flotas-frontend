<div style="font-family: Arial, sans-serif; background-color: #f4f7f6; min-height: 100vh; padding: 20px;">
  
  <!-- Encabezado Corporativo (Color UDLA) -->
  <div style="max-width: 800px; margin: 0 auto 20px auto; background-color: #8a1538; color: white; padding: 15px 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h1 style="margin: 0; font-size: 24px;">Core Logístico - Panel de Administración MVC</h1>
    <p style="margin: 5px 0 0 0; font-size: 14px;">Módulo de Alimentación para Auditoría de Flotas</p>
  </div>

  <!-- Barra de Navegación (Pestañas) -->
  <div style="max-width: 800px; margin: 0 auto 20px auto; display: flex; justify-content: center; gap: 10px;">

    <!-- Nuevo botón al inicio del menú -->
    <button (click)="cambiarVista('instituciones')" 
            [ngStyle]="{'background-color': vistaActual === 'instituciones' ? '#673ab7' : '#ccc', 'color': vistaActual === 'instituciones' ? 'white' : '#333'}" 
            style="padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s;">
      1. Instituciones
    </button>
    
    <button (click)="cambiarVista('aseguradoras')" 
            [ngStyle]="{'background-color': vistaActual === 'aseguradoras' ? '#28a745' : '#ccc', 'color': vistaActual === 'aseguradoras' ? 'white' : '#333'}" 
            style="padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s;">
      2. Aseguradoras
    </button>

    <button (click)="cambiarVista('polizas')" 
            [ngStyle]="{'background-color': vistaActual === 'polizas' ? '#ff9800' : '#ccc', 'color': vistaActual === 'polizas' ? 'white' : '#333'}" 
            style="padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s;">
      3. Pólizas
    </button>

    <button (click)="cambiarVista('vehiculos')" 
            [ngStyle]="{'background-color': vistaActual === 'vehiculos' ? '#007bff' : '#ccc', 'color': vistaActual === 'vehiculos' ? 'white' : '#333'}" 
            style="padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s;">
      4. Vehículos
    </button>

  </div>

  <!-- Contenedor Dinámico (Renderiza solo la vista activa) -->
  <div style="max-width: 800px; margin: 0 auto;">
    <app-admin-instituciones *ngIf="vistaActual === 'instituciones'"></app-admin-instituciones>
    <app-admin-aseguradoras *ngIf="vistaActual === 'aseguradoras'"></app-admin-aseguradoras>
    <app-admin-polizas *ngIf="vistaActual === 'polizas'"></app-admin-polizas>
    <app-admin-vehiculos *ngIf="vistaActual === 'vehiculos'"></app-admin-vehiculos>
  </div>

</div>
